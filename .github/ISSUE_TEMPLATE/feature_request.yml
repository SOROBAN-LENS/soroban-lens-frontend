name: Feature request
description: Suggest an improvement to the SorobanLens frontend
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: contract
    attributes:
      label: Scope
      options:
        - label: This requires an API change in soroban-lens-backend
